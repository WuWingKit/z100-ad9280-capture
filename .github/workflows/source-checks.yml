name: SPI source and protocol checks
on:
  push:
    branches: [feature/spi-8byte-20261105]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spi-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate SPI source and recorded board data
        run: python3 scripts/check_spi_repository.py
      - name: Check frame parsing and UI flow
        run: |
          node web/test_signal.cjs
          node web/test_live.cjs
          python3 scripts/test_source_encoding.py
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y iverilog
      - name: Exercise actual SPI RTL over all byte values
        run: |
          iverilog -g2012 -s tb_spi_burst8 -o /tmp/spi_burst rtl/spi_master_burst8.v sim/spi_slave_model.v sim/tb_spi_burst8.v
          vvp /tmp/spi_burst
