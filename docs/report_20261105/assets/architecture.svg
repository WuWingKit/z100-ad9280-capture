<polygon points="483,475 477,465 489,465" fill="#ea580c"/>
<polyline points="483,310 483,286 330,286 330,300 177,300 177,315" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="177,315 171,305 183,305" fill="#0f766e"/>
<text x="58" y="294" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#0f766e" font-weight="normal">PL 提供 SCLK / CS_n / MOSI</text>
<rect x="30" y="735" width="1380" height="110" rx="18" fill="#0f172a" stroke="none" stroke-width="1.5"/>
<text x="53" y="771" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" fill="#ffffff" font-weight="bold">时钟与片选：100 MHz 差分 → MMCM 16 MHz → 同步 ÷16 生成采集期间 1 MHz CS 节拍</text>
<text x="53" y="803" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="19" fill="#cbd5e1" font-weight="normal">每个 CS 低 500 ns，含 8 个 SCLK 下降沿 = 1 字节；每次 START 共 8 个 CS 事务，结束后 CS 保持高。</text>
<text x="53" y="829" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#cbd5e1" font-weight="normal">图示为设计架构：功能已上板验证；16 MHz / 500 ns 的实际时序仍待 ILA 留样。</text>
<rect x="30" y="865" width="1380" height="52" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="52" y="898" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" fill="#9a3412" font-weight="bold">范围：内部 EMIO，无外部 SPI 接线；当前输入不是 ADC / 真实雷达数据；本 SPI 副本不执行 FFT。</text>
</svg>