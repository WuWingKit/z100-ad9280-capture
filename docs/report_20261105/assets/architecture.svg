<text x="1198" y="250" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">等待 DMA 真正完成</text>
<text x="1198" y="275" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">缓存失效后逐字节比较</text>
<text x="1198" y="300" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">统计 / CRC32 / 保护区</text>
