<rect x="378" y="185" width="5" height="85" rx="2" fill="#ea580c" stroke="none" stroke-width="1.5"/>
<text x="396" y="216" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" fill="#1e293b" font-weight="bold">控制通路：GP0 / AXI-Lite</text>
<text x="396" y="245" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">GPIO 发 START / 参数；配置 DMA 地址和长度</text>
<polyline points="305,220 378,220" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 6"/>
<polygon points="378,220 368,214 368,226" fill="#ea580c"/>
<polyline points="778,226 846,226 846,290 483,290 483,310" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 6"/>
<polygon points="483,310 477,300 489,300" fill="#ea580c"/>
