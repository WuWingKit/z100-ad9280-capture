<text x="396" y="506" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" fill="#1e293b" font-weight="bold">AXI DMA / S2MM</text>
<text x="396" y="535" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">流数据 → 带地址写入</text>
<text x="396" y="560" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">Simple DMA 长度 8 B</text>
