<text x="638" y="535" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">TVALID &amp; TREADY 才读</text>
<text x="638" y="560" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">第 2 个 32位字 TLAST</text>
