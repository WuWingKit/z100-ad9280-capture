<text x="68" y="375" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">硬件串行移出 MISO</text>
<text x="68" y="400" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">MOSI 接收 A5 校验字节</text>
