<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
<rect width="1440" height="940" fill="#f8fafc"/>
<text x="40" y="48" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="30" fill="#1e293b" font-weight="bold">SPI 接收 → DDR 存储：板内闭环架构</text>
