<text x="396" y="370" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">Mode 2 / MSB first</text>
<text x="396" y="395" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="normal">SCLK 下降沿取 1 bit</text>
